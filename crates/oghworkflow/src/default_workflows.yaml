# Built-in workflows. A source without `workflows:` runs `default`, which is
# what the collector always did with each module it finds. Copy one into the
# `workflows:` of collector.yaml under another name to change it (a workflow
# defined there with the same name replaces the built-in one).
default:
  on: module
  nodes:
    # Unchanged since the last run (same last commit, same rules): store the
    # manifest only, keep the stored analysis.
    - id: changed
      type: if
      when: not unchanged
      then: stats
      else: store
    - id: stats
      type: git_stats
      next: analyze
    - id: analyze
      type: analyze_code
      next: security
    - id: security
      type: security
      next: migration
    - id: migration
      type: migration_notes
      next: store
    - id: store
      type: store_module
      next: osv
    - id: osv
      type: osv
