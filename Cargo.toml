[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = '2021'
version = "0.1.0"
authors = ["Alexandre D. <dev@redneboa.es>"]
description = "Odoo Module Metadata"
documentation = "https://ommd.info"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
actix-web = "4"
actix-files = "0.6"
actix-utils = "3"
actix-web-lab = "0.20"
actix-cors = "0.6"
actix-session = { version = "0.8", features = ["cookie-session"] }
actix-multipart = "0.7"
env_logger = "0.10"
log = "0.4"
array_tool = "1"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }
pyo3 = { version = "0.29", features = ["auto-initialize"] }
chrono = { version = "0.4" }
cached = { version = "0.59" }
minijinja = { version = "1", features = ["loader", "urlencode"] }
minijinja-autoreload = "1"
config = "0.15"
url = "2"
ipnet = "2"
lazy_static = "1"
fs_extra = "1.3"
regex = "1.10"
duct = "1.1"
named-lock = "0.4"
urlencoding = "2.1"
base64 = "0.22"
diesel = { version = "2.3", features = ["sqlite", "r2d2"] }
diesel_migrations = "2"
rmcp = { version = "2.1.0", features = ["transport-streamable-http-server"] }
axum = "0.8"
