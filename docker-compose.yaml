name: oghcollector

x-app: &app
  image: oghcollector:local
  build:
    context: .
    target: final
  volumes:
    - app_data:/app/data
  environment:
    RUST_LOG: info
    RUST_BACKTRACE: 0

services:
  migrate:
    <<: *app
    entrypoint: oghmigrate
    command: []

  server:
    <<: *app
    command: oghserver
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 8080:8080

  mcp:
    <<: *app
    command: oghmcp
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 8081:8081

  collector:
    <<: *app
    # Collects every source in collector.yaml every 6 hours, and a pushed
    # repository as soon as its webhook arrives (see README, "Scheduling updates").
    command: [oghcollector, --listen]
    # PID 1 that reaps the git processes a killed job leaves behind.
    init: true
    # On stop it TERMs the running job and waits for it, so git drops its locks.
    stop_grace_period: 30s
    restart: unless-stopped
    volumes:
      - app_data:/app/data
      - ./collector.yaml:/app/collector.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 8082:8082

volumes:
  app_data:
