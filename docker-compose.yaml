name: oghcollector

x-app: &app
  image: oghcollector:local
  build:
    context: .
    target: final
  volumes:
    - app_data:/app/data
  environment:
    RUST_LOG: info
    RUST_BACKTRACE: 0

services:
  migrate:
    <<: *app
    entrypoint: oghmigrate
    command: []

  server:
    <<: *app
    command: oghserver
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 8080:8080

  mcp:
    <<: *app
    command: oghmcp
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 8081:8081

  collector:
    <<: *app
    command: [sleep, infinity]
    restart: unless-stopped
    volumes:
      - app_data:/app/data
      - ./collector.yaml:/app/collector.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.refresh.schedule: "0 0 */6 * * *"
      ofelia.job-exec.refresh.no-overlap: "true"
      ofelia.job-exec.refresh.user: appuser
      # Collects every source in collector.yaml (see README, "Scheduling updates").
      ofelia.job-exec.refresh.command: oghcollector

  ofelia:
    image: mcuadros/ofelia:0.3.22
    command: [daemon, --docker, -f, "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}"]
    restart: unless-stopped
    depends_on:
      collector:
        condition: service_started
        # Ofelia reads the job labels only on start: restart it whenever
        # `up` recreates the collector, or it keeps running the old command.
        restart: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  app_data:
