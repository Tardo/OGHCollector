# Copy to docker-compose.yaml (git-ignored) and adjust; layer local changes in docker-compose.override.yaml.
name: oghcollector

x-app: &app
  # Built and published by .github/workflows/docker.yml
  image: ghcr.io/tardo/oghcollector:latest
  volumes:
    - app_data:/app/data
  environment:
    RUST_LOG: info
    RUST_BACKTRACE: 0

services:
  migrate:
    <<: *app
    entrypoint: oghmigrate
    command: []

  server:
    <<: *app
    command: oghserver
    restart: unless-stopped
    volumes:
      - app_data:/app/data
      # Only read with `workflow_editor_enabled`: the workflows (never the
      # sources) are shown on /workflows.
      - ./collector.yaml:/app/collector.yaml:ro
      - ./workflows.yaml:/app/workflows.yaml:ro
      - ./server.yaml:/app/server.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 8080:8080

  mcp:
    <<: *app
    command: oghmcp
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 8081:8081

  collector:
    <<: *app
    # Collects every source in collector.yaml every 6 hours, and a pushed
    # repository as soon as its webhook arrives (see docs/collector.md, "Scheduling updates").
    command: [oghcollector, --listen]
    # PID 1 that reaps the git processes a killed job leaves behind.
    init: true
    # Scans must not starve the host (other services stopped answering):
    # cap CPU and RAM, and yield CPU/disk to everything else.
    cpus: 2
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 512
    cpu_shares: 128
    blkio_config:
      weight: 100
    # On stop it TERMs the running job and waits for it, so git drops its locks.
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      RUST_LOG: info
      RUST_BACKTRACE: 0
      # Hook cache of the `pre_commit` workflow node, kept across jobs.
      OGHCOLLECTOR_PRE_COMMIT_HOME: /app/data/.pre-commit
    # API tokens, read from /run/secrets (see docs/auth.md). Both files must
    # exist: leave the one you don't use empty.
    secrets:
      - gh_token
      - gl_token
    volumes:
      - app_data:/app/data
      - ./collector.yaml:/app/collector.yaml:ro
      # The workflows its sources name: edit it here, the next job reads it.
      - ./workflows.yaml:/app/workflows.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 8082:8082

secrets:
  gh_token:
    file: ./gh_token.txt
  gl_token:
    file: ./gl_token.txt

volumes:
  app_data:
