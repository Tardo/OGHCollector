# What `oghcollector` collects when run without a source (the `--listen`
# daemon's schedule does exactly that). Jobs run in the order listed, one per version, each
# the same as `oghcollector <source>[:<paths>] <version> <git>`.
# `oghcollector --check` validates this file and prints those jobs.
#
# templates: named lists of module folders, referenced by `template:`
# workflows: named graphs of nodes run on each module a job finds (see the
#           README, "Workflows"); the built-in `default` is what the
#           collector always did
# sources:
#   source:   organization/group (every repo directly in it) or `owner/repo`
#             (GitLab: `group/project`, or `group/subgroup`; a group's
#             subgroups aren't included, list each one as its own source)
#   versions: Odoo versions (branches) to collect
#   template: module folders from `templates` (optional)
#   paths:    module folders, relative to each repo root, added after the
#             template's (default with neither: the repo root; "" or "." is
#             the root too)
#   git:      GH (default) or GL
#   base_url: GitLab API URL of a self-hosted instance (default: gitlab.com)
#   instance: ask the real prod/demo of each Doodba project it finds (Odoo JSON-RPC, API key
#             from a secret; see crates/collector/src/instance.rs). Example:
#               instance: {hosts: [client.example], login: ogh-bot,
#                          api_key: "vault:secret/data/odoo/{repo}#api_key", db: "{repo}"}
#   workspaces: portal workspaces its repos are shown in (default: all of
#             them). Letters, digits, '-' and '_'. Entries with the same
#             `source` share the union. Dependencies on modules of other
#             workspaces are still resolved and their pages still open.
#   pull_requests: migration (default) tracks only OCA port branches
#             (`18.0-mig-<module>`), nothing analyzed; full tracks every open
#             PR/MR, maps it to the modules it changes and analyzes them at
#             its head. Meant for your own repos (pair it with webhooks).
#   workflows: workflows run on each of its modules (default: [default];
#             []: only the walk, nothing stored or analyzed) and PRs
#   actions:  outward workflow nodes allowed to act for real here (ai,
#             pr_comment, pr_edit, pr_review, pr_open, apprise, project_pr); the rest
#             only log what they would do (default: none)
#
# A repo whose branch has a Doodba layout (odoo/custom/src/repos.yaml and
# addons.yaml) is also stored as a project (server: `projects_enabled`):
# template drift, repos.yaml patches, addons, lint hooks, dependencies and
# their PyPI advisories. No key needed; `template: doodba` collects their
# private addons too, plus the modules at the root of the plain addon repos
# of the same group. Patches that are GitHub PRs get their state (merged,
# closed) in a GitLab job only when a GitHub token is set too.
#
# Unknown keys are errors. JSON or TOML with the same keys also work
# (`--config collector.json`).
templates:
  openerp: [addons, openerp/addons]
  odoo: [addons, odoo/addons]
  doodba: [., odoo/custom/src/private]

sources:
  - source: odoo/odoo
    template: openerp
    versions: [6.1, 7.0, 8.0, 9.0]
  - source: odoo/odoo
    template: odoo
    versions: [10.0, 11.0, 12.0, 13.0, 14.0, 15.0, 16.0, 17.0, 18.0, 19.0, 20.0]
  - source: OCA
    versions: [6.1, 7.0, 8.0, 9.0, 10.0, 11.0, 12.0, 13.0, 14.0, 15.0, 16.0, 17.0, 18.0, 19.0, 20.0]
  # - source: MyGroup
  #   git: GL
  #   base_url: https://mygitlabinstance.com/api/v4/
  #   versions: [18.0]
  #   workspaces: [mycompany]
  #   pull_requests: full
  # - source: MyProjects  # a group of Doodba projects, one branch per Odoo version
  #   git: GL
  #   base_url: https://mygitlabinstance.com/api/v4/
  #   template: doodba
  #   versions: [16.0, 17.0, 18.0]
